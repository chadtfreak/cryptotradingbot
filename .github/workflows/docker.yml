name: Build Umbrel image

on:
  push:
    branches: ["**"]
    paths:
      - "bot/**"
      - "Dockerfile"
      - "requirements.txt"
      - "config.toml"
      - "VERSION"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # Only once the image is published, point the Umbrel app at it. Umbrel reads the app files
  # straight away, so bumping them earlier makes it try to download an image that isn't there yet.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Point the Umbrel app at the new image
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          current=$(sed -n 's/^version: "\(.*\)"$/\1/p' chad-survival-bot/umbrel-app.yml)
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
          if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
            echo "Umbrel app already on $current, nothing to do."
            exit 0
          fi
          sed -i "s/^version: \".*\"$/version: \"$VERSION\"/" chad-survival-bot/umbrel-app.yml
          sed -i "s|ghcr.io/${{ github.repository }}:.*|ghcr.io/${{ github.repository }}:$VERSION|" chad-survival-bot/docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION to the Umbrel app store"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

# Bot settings. Secrets (passwords, keys) go in environment variables, never here.

[bot]
mode = "paper"              # "paper" only for now. Live trading is stage 2.
pair = "ETHUSDT"            # Kraken pair used for prices
asset = "ETH"
interval_minutes = 240      # candle size the strategy trades on (4 hours)
poll_seconds = 60           # how often the bot wakes up to check prices and stops
starting_balance = 100.0    # USDT
db_path = "data/bot.db"

[strategy]
fast_ema = 20
slow_ema = 50
atr_period = 14
atr_stop_mult = 2.5         # stop sits this many ATRs below price, and trails up
risk_per_trade = 0.02       # lose at most 2% of equity if the stop is hit
max_position_pct = 0.95     # never put more than 95% of cash into one trade
min_trade_usd = 10.0

[costs]
# Modelled on Hyperliquid's ETH perpetual (taker fee, small slippage, no gas).
# Both bots pay hourly funding at Hyperliquid's live rate while holding a position.
pool_fee_pct = 0.045
slippage_pct = 0.02
gas_per_swap_usd = 0.0

[survival]
monthly_running_cost_usd = 1.0   # Umbrel power share. The bot pays this out of its own balance.
floor_usd = 50.0                 # below this the bot is "dead": it sells up and stops for good

[guardrails]
# The maths bot's hard limits. It can't override these.
style = "careful"
max_risk_per_trade = 0.03        # never risk more than 3% of equity on one trade
min_stop_distance_pct = 1.0      # every buy needs a stop 1% to 15% below price
max_stop_distance_pct = 15.0
max_trades_per_day = 4
daily_loss_limit_pct = 5.0       # lose this much in a UTC day and it sits out until tomorrow
allow_adding = false
stops_only_up = true
allow_short = false
max_leverage = 1.0
max_positions = 1
min_volume_usd = 0               # ETH only

[claude_guardrails]
# Claude's hard limits: "full send". Only the $50 survival floor and the thinking budget really hold it back.
style = "full send"
max_risk_per_trade = 0.25        # can risk up to 25% of equity on one trade
min_stop_distance_pct = 0.5      # every buy still needs a stop, anywhere 0.5% to 50% below price
max_stop_distance_pct = 50.0
max_trades_per_day = 0           # no limit
daily_loss_limit_pct = 0         # no daily loss limit
allow_adding = true              # can add to a position it already holds
stops_only_up = false            # can move its stop up or down
allow_short = true               # can bet on ETH falling
max_leverage = 1.0               # never more exposure than its equity. Hard-coded safety, keep at 1.
max_positions = 10               # up to 10 coins at once
min_volume_usd = 20000000        # any Hyperliquid coin with $20M+ daily volume

[claude]
enabled = true
db_path = "data/claude.db"
monthly_budget_usd = 15.0        # hard cap on Claude's thinking, per calendar month
smart_model = "claude-opus-5-5"  # used while Claude is healthy and on budget
lean_model = "claude-sonnet-5-5" # used when money or budget is tight
review_model = "claude-opus-5-5" # weekly review where it updates its lessons
heartbeat_hours = 24.0           # check in at least this often even when nothing happens
move_trigger_pct = 1.5           # wake if price moves this much since the last check
min_minutes_between_wakes = 15  # market events can wake it this often at most
min_check_hours = 0.25           # shortest check-in Claude can schedule for itself: it decides how often to look
review_every_days = 7
web_searches_per_wake = 2        # news searches allowed per check, when budget allows
allow_mainnet = false            # real-money Hyperliquid stays locked until the testnet run has proved itself
learning_phase_budget_usd = 40.0 # a one-off learning phase: thinking paid by the owner, not Claude's balance, smartest model throughout
learning_phase_days = 30         # it starts on first run and ends after this many days or when the budget is used

manifestVersion: 1
id: chad-survival-bot
name: Survival Bot
tagline: Claude trades crypto and has to pay for its own thinking
icon: https://raw.githubusercontent.com/chadtfreak/cryptotradingbot/HEAD/bot/static/icon.svg
category: finance
version: "1.9.0"
port: 8766
description: >-
  Claude trades any liquid crypto, long or short, with its own small account. Every time it thinks, the
  cost comes out of its own balance, and it dies if it falls below its survival
  floor. It keeps a trading journal and reviews itself every week to learn.
  A simple maths bot trades alongside it as a rival.


  Currently in paper mode: live prices, pretend money. Needs an Anthropic API
  key, added in the dashboard.

developer: chadtfreak
website: https://github.com/chadtfreak/cryptotradingbot
submitter: chadtfreak
submission: https://github.com/chadtfreak/cryptotradingbot
repo: https://github.com/chadtfreak/cryptotradingbot
support: https://github.com/chadtfreak/cryptotradingbot/issues
gallery:
  - https://raw.githubusercontent.com/chadtfreak/cryptotradingbot/HEAD/chad-survival-bot/gallery-1.png
releaseNotes: >-
  You can now add to Claude's bankroll from the dashboard (under "Where Claude
  trades"), up to everything spare in the testnet account. Its survival floor
  moves with it, staying at half the bankroll, and promotions scale too: 1, 2
  and 4 times its bankroll. Version 1.9.1 skips coins whose testnet order book
  is too thin to trade, like PUMP.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""

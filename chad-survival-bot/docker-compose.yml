version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: chad-survival-bot_server_1
      APP_PORT: 8765

  server:
    image: ghcr.io/chadtfreak/cryptotradingbot:1.9.0
    restart: on-failure
    environment:
      AUTH_HANDLED_BY_UMBREL: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
